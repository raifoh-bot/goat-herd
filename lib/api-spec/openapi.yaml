openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dairy Goat Herd Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: goats
    description: Dairy goat management
  - name: dashboard
    description: Herd dashboard and stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /goats:
    get:
      operationId: listGoats
      tags: [goats]
      summary: List all dairy goats
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [healthy, watch, treatment, dry]
        - name: breed
          in: query
          schema:
            type: string
            enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
      responses:
        "200":
          description: List of dairy goats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"
    post:
      operationId: createGoat
      tags: [goats]
      summary: Add a new dairy goat to the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatBody"
      responses:
        "201":
          description: Created goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"

  /goats/{id}:
    get:
      operationId: getGoat
      tags: [goats]
      summary: Get a single dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A dairy goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    put:
      operationId: updateGoat
      tags: [goats]
      summary: Update a dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    delete:
      operationId: deleteGoat
      tags: [goats]
      summary: Remove a dairy goat from the herd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Goat removed
        "404":
          description: Goat not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get herd dashboard summary
      responses:
        "200":
          description: Dashboard summary with counts and production stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/breed-breakdown:
    get:
      operationId: getBreedBreakdown
      tags: [dashboard]
      summary: Get goat counts by breed
      responses:
        "200":
          description: Breed breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedCount"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recently added or updated goats
      responses:
        "200":
          description: Recent goat activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Goat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          enum: [milking, dry, pregnant, kid]
        age:
          type: integer
        description:
          type: string
        imageUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - breed
        - status
        - milkPerDay
        - lactationStatus
        - age
        - createdAt
        - updatedAt

    CreateGoatBody:
      type: object
      properties:
        name:
          type: string
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          enum: [milking, dry, pregnant, kid]
        age:
          type: integer
        description:
          type: string
        imageUrl:
          type: string
      required:
        - name
        - breed
        - status
        - milkPerDay
        - lactationStatus
        - age

    UpdateGoatBody:
      type: object
      properties:
        name:
          type: string
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          enum: [milking, dry, pregnant, kid]
        age:
          type: integer
        description:
          type: string
        imageUrl:
          type: string

    DashboardSummary:
      type: object
      properties:
        totalGoats:
          type: integer
        healthyCount:
          type: integer
        treatmentCount:
          type: integer
        milkingCount:
          type: integer
        dryCount:
          type: integer
        averageMilkPerDay:
          type: number
        topProducer:
          $ref: "#/components/schemas/Goat"
      required:
        - totalGoats
        - healthyCount
        - treatmentCount
        - milkingCount
        - dryCount
        - averageMilkPerDay

    BreedCount:
      type: object
      properties:
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        count:
          type: integer
      required:
        - breed
        - count
