openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MyGoatHerd API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: goats
    description: Goat management
  - name: breedings
    description: Breeding and kidding records
  - name: dashboard
    description: Herd dashboard and stats
  - name: semen
    description: Frozen semen straw inventory
  - name: auth
    description: Authentication and current-user session
  - name: users
    description: User account management
  - name: settings
    description: Farm-level settings
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /goats:
    get:
      operationId: listGoats
      tags: [goats]
      summary: List all dairy goats
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [dead, leased, on-farm, retired, sold-registered, sold-not-registered]
        - name: sex
          in: query
          schema:
            type: string
            enum: [doe, buck, wether]
      responses:
        "200":
          description: List of dairy goats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"
    post:
      operationId: createGoat
      tags: [goats]
      summary: Add a new dairy goat to the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatBody"
      responses:
        "201":
          description: Created goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"

  /goats/{id}:
    get:
      operationId: getGoat
      tags: [goats]
      summary: Get a single dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A dairy goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    put:
      operationId: updateGoat
      tags: [goats]
      summary: Update a dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    delete:
      operationId: deleteGoat
      tags: [goats]
      summary: Remove a dairy goat from the herd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Goat removed
        "404":
          description: Goat not found

  /goats/{id}/photos:
    post:
      operationId: addGoatPhoto
      tags: [goats]
      summary: Append a photo to a goat's photo set
      description: >-
        Appends a single photo URL to the goat's imageUrls (max 4). Available to
        any authenticated farm member, including Farm Hands, so photos can be
        captured in the field without full goat-edit permissions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGoatPhotoBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "400":
          description: Invalid photo URL or the goat already has 4 photos
        "404":
          description: Goat not found

  /goats/{id}/photos/default:
    put:
      operationId: setGoatDefaultPhoto
      tags: [goats]
      summary: Set a goat's default photo
      description: >-
        Designates which photo (by index into imageUrls) is the goat's default,
        shown on herd cards, the detail hero, and anywhere a single
        representative image is used. Manager-only (Admin/Owner).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGoatDefaultPhotoBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "400":
          description: Index is out of bounds of the goat's photos
        "404":
          description: Goat not found

  /goats/export:
    get:
      operationId: exportGoats
      tags: [goats]
      summary: Export the herd as a CSV file
      description: >-
        Streams the farm's full goat list as a CSV download. Available to any
        authenticated farm member (read-only).
      responses:
        "200":
          description: CSV file of all goats in the farm
          content:
            text/csv:
              schema:
                type: string

  /goats/import:
    post:
      operationId: importGoats
      tags: [goats]
      summary: Bulk import goats into the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGoatsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportGoatsResult"

  /goats/{id}/health-events:
    get:
      operationId: listGoatHealthEvents
      tags: [health-events]
      summary: List a goat's health events (newest first)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The goat's health events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthEvent"
        "404":
          description: Goat not found
    post:
      operationId: createGoatHealthEvent
      tags: [health-events]
      summary: Record a health event for a goat (any farm member)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHealthEventBody"
      responses:
        "201":
          description: Health event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEvent"
        "404":
          description: Goat not found

  /goats/{id}/health-events/{eventId}:
    delete:
      operationId: deleteGoatHealthEvent
      tags: [health-events]
      summary: Delete a health event (Admin/Owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Health event deleted
        "404":
          description: Health event not found

  /health-events/bulk-session:
    get:
      operationId: getHealthEventBulkSession
      tags: [health-events]
      summary: List the goats eligible for a herd-work-day bulk session
      description: >-
        Returns the farm's goats that are worked during a herd work day —
        excludes goats whose herd status is dead, sold (registered or not registered), or retired.
      responses:
        "200":
          description: Eligible goats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"

  /health-events/bulk:
    post:
      operationId: createHealthEventsBulk
      tags: [health-events]
      summary: Record health events for many goats in one batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkHealthEventsBody"
      responses:
        "201":
          description: All events recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                    description: Number of health events created
                required:
                  - created
        "404":
          description: One or more goats not found in this farm

  /health-events/due:
    get:
      operationId: getHealthWorkDue
      tags: [health-events]
      summary: List goats with routine health work due or overdue
      description: >-
        Uses the farm's per-event-type interval settings to work out which
        goats are due (or overdue) for routine work such as hoof trims, CD&T
        boosters, copper bolus, and deworming. Only goats worked on a herd work
        day are considered (dead, sold, and retired goats are excluded).
      responses:
        "200":
          description: The configured intervals and the goats with work due
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDueResponse"

  /breedings:
    get:
      operationId: listBreedings
      tags: [breedings]
      summary: List all breeding records
      responses:
        "200":
          description: List of breeding records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedingWithDoe"
    post:
      operationId: createBreeding
      tags: [breedings]
      summary: Record a new breeding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreedingBody"
      responses:
        "201":
          description: Created breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"

  /breedings/export:
    get:
      operationId: exportBreedings
      tags: [breedings]
      summary: Export breeding records as a CSV file
      description: >-
        Streams all breeding records for the farm as a CSV download. Available to
        any authenticated farm member (read-only).
      responses:
        "200":
          description: CSV file of all breeding records in the farm
          content:
            text/csv:
              schema:
                type: string

  /breedings/kids/export:
    get:
      operationId: exportKids
      tags: [breedings]
      summary: Export kidding outcomes as a CSV file
      description: >-
        Streams all kid records for the farm as a CSV download, joined to their
        breeding for the doe's name. Available to any authenticated farm member
        (read-only).
      responses:
        "200":
          description: CSV file of all kid records in the farm
          content:
            text/csv:
              schema:
                type: string

  /breedings/import:
    post:
      operationId: importBreedings
      tags: [breedings]
      summary: Bulk import breeding records from a spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBreedingsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBreedingsResult"

  /kids/import:
    post:
      operationId: importKids
      tags: [breedings]
      summary: Bulk import kidding outcomes from a spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportKidsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportKidsResult"

  /breedings/{id}:
    get:
      operationId: getBreeding
      tags: [breedings]
      summary: Get a breeding record with kids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Breeding record with doe and kids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingDetail"
        "404":
          description: Breeding not found
    put:
      operationId: updateBreeding
      tags: [breedings]
      summary: Update a breeding record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreedingBody"
      responses:
        "200":
          description: Updated breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"
        "404":
          description: Breeding not found
    delete:
      operationId: deleteBreeding
      tags: [breedings]
      summary: Delete a breeding record and its kids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Breeding deleted
        "404":
          description: Breeding not found

  /breedings/{id}/kids:
    post:
      operationId: addKids
      tags: [breedings]
      summary: Record kids from a kidding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddKidsBody"
      responses:
        "201":
          description: Kids recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kid"
        "404":
          description: Breeding not found

  /breedings/{id}/pregnancy-tests:
    post:
      operationId: createPregnancyTest
      tags: [breedings]
      summary: Record a pregnancy test result for a breeding
      description: >-
        Logs a pregnancy test against a breeding. Optionally, in the same call,
        confirms the pregnancy (positive result), marks the doe open (negative
        result), and/or records a final cover event before closing out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePregnancyTestBody"
      responses:
        "201":
          description: Pregnancy test recorded; the updated breeding with all tests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingDetail"
        "404":
          description: Breeding not found

  /breedings/{id}/pregnancy-tests/{testId}:
    put:
      operationId: updatePregnancyTest
      tags: [breedings]
      summary: Correct a recorded pregnancy test
      description: >-
        Updates the date, method, result, tester, and/or notes of an existing
        pregnancy test. Does not change the breeding or doe status.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: testId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePregnancyTestBody"
      responses:
        "200":
          description: Pregnancy test updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregnancyTest"
        "404":
          description: Pregnancy test not found
    delete:
      operationId: deletePregnancyTest
      tags: [breedings]
      summary: Delete a recorded pregnancy test
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: testId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pregnancy test deleted
        "404":
          description: Pregnancy test not found

  /breedings/{id}/events:
    post:
      operationId: createBreedingEvent
      tags: [breedings]
      summary: Log an exposure/cover/removal event for a breeding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreedingEventBody"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingEvent"
        "404":
          description: Breeding not found

  /breedings/{id}/events/{eventId}:
    put:
      operationId: updateBreedingEvent
      tags: [breedings]
      summary: Update a breeding event's date and/or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreedingEventBody"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingEvent"
        "404":
          description: Event not found
    delete:
      operationId: deleteBreedingEvent
      tags: [breedings]
      summary: Delete a breeding event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted
        "404":
          description: Event not found

  /breedings/{id}/kids/{kidId}:
    put:
      operationId: updateKid
      tags: [breedings]
      summary: Update a kid record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kidId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKidBody"
      responses:
        "200":
          description: Kid updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kid"
        "404":
          description: Kid not found
    delete:
      operationId: deleteKid
      tags: [breedings]
      summary: Delete a kid record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kidId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Kid deleted
        "404":
          description: Kid not found

  /semen-straws:
    get:
      operationId: listSemenStraws
      tags: [semen]
      summary: List semen straw inventory
      responses:
        "200":
          description: List of semen straw inventory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SemenStraw"
    post:
      operationId: createSemenStraw
      tags: [semen]
      summary: Add semen straws to inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSemenStrawBody"
      responses:
        "201":
          description: Created semen straw inventory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemenStraw"

  /semen-straws/{id}:
    put:
      operationId: updateSemenStraw
      tags: [semen]
      summary: Update a semen straw inventory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSemenStrawBody"
      responses:
        "200":
          description: Updated semen straw inventory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemenStraw"
        "404":
          description: Semen straw entry not found
    delete:
      operationId: deleteSemenStraw
      tags: [semen]
      summary: Delete a semen straw inventory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Semen straw entry deleted
        "404":
          description: Semen straw entry not found

  /semen-straws/import:
    post:
      operationId: importSemenStraws
      tags: [semen]
      summary: Bulk import semen straws into inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSemenStrawsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSemenStrawsResult"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get herd dashboard summary
      responses:
        "200":
          description: Dashboard summary with counts and production stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/breed-breakdown:
    get:
      operationId: getBreedBreakdown
      tags: [dashboard]
      summary: Get goat counts by breed
      responses:
        "200":
          description: Breed breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedCount"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recently added or updated goats
      responses:
        "200":
          description: Recent goat activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in; returns the authenticated user and a bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link by username or email
      description: >-
        Public. Looks up an account in the resolved farm by username or email and,
        if found, emails a time-limited reset link. Always returns 200 with a
        neutral message to avoid revealing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: A neutral confirmation (no account enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      description: >-
        Public. Validates the reset token (exists, not expired, not used), sets
        the new password, and invalidates the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "204":
          description: Password reset; the token is now consumed
        "400":
          description: Invalid or expired token, or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /farms/register:
    post:
      operationId: registerFarm
      tags: [farms]
      summary: Self-service registration of a new farm with its first admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFarmBody"
      responses:
        "201":
          description: The created farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Farm slug or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/summary:
    get:
      operationId: getPlatformSummary
      tags: [superadmin]
      summary: Platform-wide growth and totals (superadmin only)
      responses:
        "200":
          description: Platform totals across all farms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSummary"

  /superadmin/settings:
    get:
      operationId: getPlatformSettings
      tags: [superadmin]
      summary: Get platform status thresholds (superadmin only)
      responses:
        "200":
          description: The current platform thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformThresholds"
    put:
      operationId: updatePlatformSettings
      tags: [superadmin]
      summary: Update platform status thresholds (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformThresholdsBody"
      responses:
        "200":
          description: The updated platform thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformThresholds"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms:
    get:
      operationId: listFarms
      tags: [superadmin]
      summary: List all farms (superadmin only)
      responses:
        "200":
          description: List of farms with user and goat counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuperadminFarm"
    post:
      operationId: createFarm
      tags: [superadmin]
      summary: Create a new farm with its first admin user (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmBody"
      responses:
        "201":
          description: The created farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Farm slug or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms/{id}:
    put:
      operationId: updateFarm
      tags: [superadmin]
      summary: Update a farm's name or status (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmBody"
      responses:
        "200":
          description: The updated farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
        "404":
          description: Farm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms/{id}/view:
    post:
      operationId: viewFarm
      tags: [superadmin]
      summary: Begin a read-only view of a farm's data (superadmin only); records an audit log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The farm to view
          content:
            application/json:
              schema:
                type: object
                required: [slug, name]
                properties:
                  slug:
                    type: string
                  name:
                    type: string
        "404":
          description: Farm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms/{id}/users:
    get:
      operationId: listFarmUsers
      tags: [superadmin]
      summary: List a farm's user accounts (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The farm's users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "404":
          description: Farm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms/{id}/users/{userId}/reset-password:
    post:
      operationId: superadminResetUserPassword
      tags: [superadmin]
      summary: Reset a farm user's password (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPasswordBody"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found in this farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /superadmin/farms/{id}/delete:
    post:
      operationId: deleteFarm
      tags: [superadmin]
      summary: Soft-delete a farm with a recorded reason (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteFarmBody"
      responses:
        "200":
          description: The deleted farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuperadminFarm"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Farm not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user accounts
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

  /users/{id}/password:
    put:
      operationId: setUserPassword
      tags: [users]
      summary: Set (reset) a user's password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPasswordBody"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get the farm settings
      responses:
        "200":
          description: The current farm settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update the farm settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmSettingsBody"
      responses:
        "200":
          description: Updated farm settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"

  /auth/password:
    put:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change the current user's own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Current password is incorrect or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/dashboard-layout:
    put:
      operationId: updateDashboardLayout
      tags: [auth]
      summary: Set or clear the current user's personal dashboard layout
      description: >-
        Saves a per-user dashboard arrangement that overrides the farm-wide
        default for this user only. Send `dashboardLayout: null` to remove the
        personal override and fall back to the farm default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDashboardLayoutBody"
      responses:
        "200":
          description: The updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Goat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, angora, boer, guernsey, kiko, lamancha, mixed, myotonic, nigerian-dwarf, nubian, oberhasli, pygmy, recorded-grade, saanen, sable, savanna, spanish, texmaster, toggenburg]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, kid, retired]
        breedingStatus:
          type: string
          nullable: true
          enum: [exposed, serviced, pregnant]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
          maxItems: 4
          description: Ordered list of up to 4 photo URLs for this goat
        defaultPhotoIndex:
          type: integer
          nullable: true
          description: >-
            Index into imageUrls of the photo chosen as the default. When null,
            the newest photo (last in imageUrls) is used as the default.
        imageUrl:
          type: string
          readOnly: true
          deprecated: true
          description: >-
            Deprecated. Resolved default photo (imageUrls[defaultPhotoIndex] when
            set, otherwise the last/newest entry), kept for backward
            compatibility with older clients.
        leasedBuck:
          type: boolean
          description: Buck is on a breeding lease and excluded from herd totals
        herdStatus:
          type: string
          nullable: true
          enum: [dead, leased, on-farm, retired, sold-registered, sold-not-registered]
          description: Current standing of the goat in the herd
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
        rightTailTattoo:
          type: string
          maxLength: 4
        leftTailTattoo:
          type: string
          maxLength: 4
        centerTailTattoo:
          type: string
          maxLength: 8
        eidNumber:
          type: string
          maxLength: 50
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - breed
        - status
        - milkPerDay
        - age
        - createdAt
        - updatedAt

    CreateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, angora, boer, guernsey, kiko, lamancha, mixed, myotonic, nigerian-dwarf, nubian, oberhasli, pygmy, recorded-grade, saanen, sable, savanna, spanish, texmaster, toggenburg]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, kid, retired]
        breedingStatus:
          type: string
          nullable: true
          enum: [exposed, serviced, pregnant]
        age:
          type: integer
          description: Legacy field, calculated from dateOfBirth
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
          maxItems: 4
          description: Ordered list of up to 4 photo URLs for this goat
        leasedBuck:
          type: boolean
        herdStatus:
          type: string
          nullable: true
          enum: [dead, leased, on-farm, retired, sold-registered, sold-not-registered]
        rightEarTattoo:
          type: string
          maxLength: 4
          nullable: true
        leftEarTattoo:
          type: string
          maxLength: 4
          nullable: true
        rightTailTattoo:
          type: string
          maxLength: 4
          nullable: true
        leftTailTattoo:
          type: string
          maxLength: 4
          nullable: true
        centerTailTattoo:
          type: string
          maxLength: 8
          nullable: true
        eidNumber:
          type: string
          maxLength: 50
          nullable: true
      required:
        - name
        - breed

    AddGoatPhotoBody:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
          description: >-
            Storage path of the uploaded photo (e.g.
            /api/storage/objects/...), appended to the goat's imageUrls.

    SetGoatDefaultPhotoBody:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          description: >-
            Zero-based index into the goat's imageUrls to use as the default
            photo. Must be within bounds of the goat's current photo set.

    UpdateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, angora, boer, guernsey, kiko, lamancha, mixed, myotonic, nigerian-dwarf, nubian, oberhasli, pygmy, recorded-grade, saanen, sable, savanna, spanish, texmaster, toggenburg]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, kid, retired]
        breedingStatus:
          type: string
          nullable: true
          enum: [exposed, serviced, pregnant]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
          maxItems: 4
          description: Ordered list of up to 4 photo URLs for this goat
        leasedBuck:
          type: boolean
        herdStatus:
          type: string
          nullable: true
          enum: [dead, leased, on-farm, retired, sold-registered, sold-not-registered]
        rightEarTattoo:
          type: string
          maxLength: 4
          nullable: true
        leftEarTattoo:
          type: string
          maxLength: 4
          nullable: true
        rightTailTattoo:
          type: string
          maxLength: 4
          nullable: true
        leftTailTattoo:
          type: string
          maxLength: 4
          nullable: true
        centerTailTattoo:
          type: string
          maxLength: 8
          nullable: true
        eidNumber:
          type: string
          maxLength: 50
          nullable: true

    Breeding:
      type: object
      properties:
        id:
          type: integer
        doeId:
          type: integer
        sireName:
          type: string
        breedingMethod:
          type: string
          enum: [natural, ai]
          description: Breeding method — natural service (buck placed with doe) or artificial insemination
        semenSource:
          type: string
          nullable: true
          description: Optional free-text semen source/supplier note (AI breedings)
        semenStrawId:
          type: integer
          nullable: true
          description: The semen straw inventory entry this AI breeding was drawn from, if any
        breedingDate:
          type: string
          format: date-time
        expectedKiddingDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [bred, confirmed-pregnant, kidded, open]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - doeId
        - sireName
        - breedingMethod
        - breedingDate
        - status
        - createdAt
        - updatedAt

    BreedingWithDoe:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"
            hasActiveExposure:
              type: boolean
              description: True when an exposed event exists but no removed event has been recorded
            exposedDays:
              type: integer
              nullable: true
              description: Days of exposure — when actively exposed, days since most recent exposed event; when removed, days between firstExposedDate and lastRemovedDate; null when no exposure events exist
            coverCount:
              type: integer
              description: Total number of witnessed cover events logged for this breeding
            hasExposureEvents:
              type: boolean
              description: True when at least one exposed event has ever been logged for this breeding
            firstExposedDate:
              type: string
              format: date-time
              nullable: true
              description: Date of the earliest exposed event for this breeding
            lastRemovedDate:
              type: string
              format: date-time
              nullable: true
              description: Date of the most recent removed event for this breeding

    BreedingDetail:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"
            events:
              type: array
              items:
                $ref: "#/components/schemas/BreedingEvent"
            pregnancyTests:
              type: array
              items:
                $ref: "#/components/schemas/PregnancyTest"

    PregnancyTest:
      type: object
      properties:
        id:
          type: integer
        breedingId:
          type: integer
        testDate:
          type: string
          format: date-time
        method:
          type: string
          enum: [ultrasound, blood, palpation, other]
        result:
          type: string
          enum: [positive, negative, inconclusive]
        testedBy:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - breedingId
        - testDate
        - method
        - result
        - createdAt
        - updatedAt

    CreatePregnancyTestBody:
      type: object
      properties:
        testDate:
          type: string
          format: date-time
        method:
          type: string
          enum: [ultrasound, blood, palpation, other]
        result:
          type: string
          enum: [positive, negative, inconclusive]
        testedBy:
          type: string
        notes:
          type: string
        confirmPregnancy:
          type: boolean
          description: When true (positive result), set the breeding to confirmed-pregnant and the doe to pregnant
