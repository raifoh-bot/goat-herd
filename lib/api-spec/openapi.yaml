openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dairy Goat Herd Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: goats
    description: Dairy goat management
  - name: breedings
    description: Breeding and kidding records
  - name: dashboard
    description: Herd dashboard and stats
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /goats:
    get:
      operationId: listGoats
      tags: [goats]
      summary: List all dairy goats
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [healthy, watch, treatment, dry]
        - name: breed
          in: query
          schema:
            type: string
            enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
      responses:
        "200":
          description: List of dairy goats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"
    post:
      operationId: createGoat
      tags: [goats]
      summary: Add a new dairy goat to the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatBody"
      responses:
        "201":
          description: Created goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"

  /goats/{id}:
    get:
      operationId: getGoat
      tags: [goats]
      summary: Get a single dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A dairy goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    put:
      operationId: updateGoat
      tags: [goats]
      summary: Update a dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    delete:
      operationId: deleteGoat
      tags: [goats]
      summary: Remove a dairy goat from the herd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Goat removed
        "404":
          description: Goat not found

  /goats/import:
    post:
      operationId: importGoats
      tags: [goats]
      summary: Bulk import goats into the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGoatsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportGoatsResult"

  /breedings:
    get:
      operationId: listBreedings
      tags: [breedings]
      summary: List all breeding records
      responses:
        "200":
          description: List of breeding records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedingWithDoe"
    post:
      operationId: createBreeding
      tags: [breedings]
      summary: Record a new breeding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreedingBody"
      responses:
        "201":
          description: Created breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"

  /breedings/{id}:
    get:
      operationId: getBreeding
      tags: [breedings]
      summary: Get a breeding record with kids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Breeding record with doe and kids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingDetail"
        "404":
          description: Breeding not found
    put:
      operationId: updateBreeding
      tags: [breedings]
      summary: Update a breeding record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreedingBody"
      responses:
        "200":
          description: Updated breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"
        "404":
          description: Breeding not found

  /breedings/{id}/kids:
    post:
      operationId: addKids
      tags: [breedings]
      summary: Record kids from a kidding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddKidsBody"
      responses:
        "201":
          description: Kids recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kid"
        "404":
          description: Breeding not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get herd dashboard summary
      responses:
        "200":
          description: Dashboard summary with counts and production stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/breed-breakdown:
    get:
      operationId: getBreedBreakdown
      tags: [dashboard]
      summary: Get goat counts by breed
      responses:
        "200":
          description: Breed breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedCount"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recently added or updated goats
      responses:
        "200":
          description: Recent goat activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Goat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, pregnant, kid, retired]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
          description: Buck is on a breeding lease and excluded from herd totals
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - breed
        - status
        - milkPerDay
        - age
        - createdAt
        - updatedAt

    CreateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, pregnant, kid, retired]
        age:
          type: integer
          description: Legacy field, calculated from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
      required:
        - name
        - breed

    UpdateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, pregnant, kid, retired]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4

    Breeding:
      type: object
      properties:
        id:
          type: integer
        doeId:
          type: integer
        sireName:
          type: string
        breedingDate:
          type: string
          format: date-time
        expectedKiddingDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [bred, confirmed-pregnant, kidded, open]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - doeId
        - sireName
        - breedingDate
        - status
        - createdAt
        - updatedAt

    BreedingWithDoe:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"

    BreedingDetail:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"

    CreateBreedingBody:
      type: object
      properties:
        doeId:
          type: integer
        sireName:
          type: string
        breedingDate:
          type: string
          format: date-time
        expectedKiddingDate:
          type: string
          format: date-time
        notes:
          type: string
      required:
        - doeId
        - sireName
        - breedingDate

    UpdateBreedingBody:
      type: object
      properties:
        sireName:
          type: string
        breedingDate:
          type: string
          format: date-time
        expectedKiddingDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [bred, confirmed-pregnant, kidded, open]
        notes:
          type: string

    Kid:
      type: object
      properties:
        id:
          type: integer
        breedingId:
          type: integer
        goatId:
          type: integer
        name:
          type: string
        sex:
          type: string
          enum: [doe, buck]
        kidStatus:
          type: string
          enum: [alive, doa]
        birthDate:
          type: string
          format: date-time
        birthWeight:
          type: number
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - breedingId
        - sex
        - createdAt
        - updatedAt

    CreateKidBody:
      type: object
      properties:
        name:
          type: string
        sex:
          type: string
          enum: [doe, buck]
        kidStatus:
          type: string
          enum: [alive, doa]
        birthDate:
          type: string
          format: date-time
        birthWeight:
          type: number
        notes:
          type: string
      required:
        - sex

    AddKidsBody:
      type: object
      properties:
        birthDate:
          type: string
          format: date-time
        kids:
          type: array
          items:
            $ref: "#/components/schemas/CreateKidBody"
      required:
        - kids

    DoeLactationBreakdown:
      type: object
      properties:
        milking:
          type: integer
        dry:
          type: integer
        pregnant:
          type: integer
        kid:
          type: integer
        retired:
          type: integer
      required:
        - milking
        - dry
        - pregnant
        - kid
        - retired

    DashboardSummary:
      type: object
      properties:
        totalGoats:
          type: integer
        doeCount:
          type: integer
        buckCount:
          type: integer
        wetherCount:
          type: integer
        healthyCount:
          type: integer
        treatmentCount:
          type: integer
        milkingCount:
          type: integer
        dryCount:
          type: integer
        averageMilkPerDay:
          type: number
        doeLactationBreakdown:
          $ref: "#/components/schemas/DoeLactationBreakdown"
        topProducer:
          $ref: "#/components/schemas/Goat"
      required:
        - totalGoats
        - doeCount
        - buckCount
        - wetherCount
        - healthyCount
        - treatmentCount
        - milkingCount
        - dryCount
        - averageMilkPerDay
        - doeLactationBreakdown

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ImportGoatRow:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        dateOfBirth:
          type: string
          format: date-time
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
        lactationStatus:
          type: string
          enum: [milking, dry, pregnant, kid, retired]
      required:
        - name
        - breed

    ImportGoatsBody:
      type: object
      properties:
        goats:
          type: array
          items:
            $ref: "#/components/schemas/ImportGoatRow"
      required:
        - goats

    ImportGoatsResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
      required:
        - imported
        - skipped
        - errors

    BreedCount:
      type: object
      properties:
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        count:
          type: integer
      required:
        - breed
        - count
