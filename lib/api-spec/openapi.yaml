openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MyGoatHerd API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: goats
    description: Goat management
  - name: breedings
    description: Breeding and kidding records
  - name: dashboard
    description: Herd dashboard and stats
  - name: semen
    description: Frozen semen straw inventory
  - name: auth
    description: Authentication and current-user session
  - name: users
    description: User account management
  - name: settings
    description: Farm-level settings
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /goats:
    get:
      operationId: listGoats
      tags: [goats]
      summary: List all dairy goats
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [dead, first-freshener, leased, on-farm, retired, sold]
        - name: sex
          in: query
          schema:
            type: string
            enum: [doe, buck, wether]
      responses:
        "200":
          description: List of dairy goats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"
    post:
      operationId: createGoat
      tags: [goats]
      summary: Add a new dairy goat to the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoatBody"
      responses:
        "201":
          description: Created goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"

  /goats/{id}:
    get:
      operationId: getGoat
      tags: [goats]
      summary: Get a single dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A dairy goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    put:
      operationId: updateGoat
      tags: [goats]
      summary: Update a dairy goat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoatBody"
      responses:
        "200":
          description: Updated goat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goat"
        "404":
          description: Goat not found
    delete:
      operationId: deleteGoat
      tags: [goats]
      summary: Remove a dairy goat from the herd
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Goat removed
        "404":
          description: Goat not found

  /goats/import:
    post:
      operationId: importGoats
      tags: [goats]
      summary: Bulk import goats into the herd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGoatsBody"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportGoatsResult"

  /breedings:
    get:
      operationId: listBreedings
      tags: [breedings]
      summary: List all breeding records
      responses:
        "200":
          description: List of breeding records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedingWithDoe"
    post:
      operationId: createBreeding
      tags: [breedings]
      summary: Record a new breeding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreedingBody"
      responses:
        "201":
          description: Created breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"

  /breedings/{id}:
    get:
      operationId: getBreeding
      tags: [breedings]
      summary: Get a breeding record with kids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Breeding record with doe and kids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingDetail"
        "404":
          description: Breeding not found
    put:
      operationId: updateBreeding
      tags: [breedings]
      summary: Update a breeding record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreedingBody"
      responses:
        "200":
          description: Updated breeding record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breeding"
        "404":
          description: Breeding not found
    delete:
      operationId: deleteBreeding
      tags: [breedings]
      summary: Delete a breeding record and its kids
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Breeding deleted
        "404":
          description: Breeding not found

  /breedings/{id}/kids:
    post:
      operationId: addKids
      tags: [breedings]
      summary: Record kids from a kidding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddKidsBody"
      responses:
        "201":
          description: Kids recorded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kid"
        "404":
          description: Breeding not found

  /breedings/{id}/events:
    post:
      operationId: createBreedingEvent
      tags: [breedings]
      summary: Log an exposure/cover/removal event for a breeding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreedingEventBody"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingEvent"
        "404":
          description: Breeding not found

  /breedings/{id}/events/{eventId}:
    put:
      operationId: updateBreedingEvent
      tags: [breedings]
      summary: Update a breeding event's date and/or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreedingEventBody"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedingEvent"
        "404":
          description: Event not found
    delete:
      operationId: deleteBreedingEvent
      tags: [breedings]
      summary: Delete a breeding event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Event deleted
        "404":
          description: Event not found

  /breedings/{id}/kids/{kidId}:
    put:
      operationId: updateKid
      tags: [breedings]
      summary: Update a kid record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kidId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKidBody"
      responses:
        "200":
          description: Kid updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kid"
        "404":
          description: Kid not found
    delete:
      operationId: deleteKid
      tags: [breedings]
      summary: Delete a kid record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kidId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Kid deleted
        "404":
          description: Kid not found

  /semen-straws:
    get:
      operationId: listSemenStraws
      tags: [semen]
      summary: List semen straw inventory
      responses:
        "200":
          description: List of semen straw inventory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SemenStraw"
    post:
      operationId: createSemenStraw
      tags: [semen]
      summary: Add semen straws to inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSemenStrawBody"
      responses:
        "201":
          description: Created semen straw inventory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemenStraw"

  /semen-straws/{id}:
    put:
      operationId: updateSemenStraw
      tags: [semen]
      summary: Update a semen straw inventory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSemenStrawBody"
      responses:
        "200":
          description: Updated semen straw inventory entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemenStraw"
        "404":
          description: Semen straw entry not found
    delete:
      operationId: deleteSemenStraw
      tags: [semen]
      summary: Delete a semen straw inventory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Semen straw entry deleted
        "404":
          description: Semen straw entry not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get herd dashboard summary
      responses:
        "200":
          description: Dashboard summary with counts and production stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/breed-breakdown:
    get:
      operationId: getBreedBreakdown
      tags: [dashboard]
      summary: Get goat counts by breed
      responses:
        "200":
          description: Breed breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreedCount"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recently added or updated goats
      responses:
        "200":
          description: Recent goat activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goat"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in; returns the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all user accounts
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user's role or active status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found

  /users/{id}/password:
    put:
      operationId: setUserPassword
      tags: [users]
      summary: Set (reset) a user's password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPasswordBody"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get the farm settings
      responses:
        "200":
          description: The current farm settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update the farm settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFarmSettingsBody"
      responses:
        "200":
          description: Updated farm settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSettings"

  /auth/password:
    put:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change the current user's own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Current password is incorrect or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Goat:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, exposed, serviced, pregnant, kid, retired]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
          description: Buck is on a breeding lease and excluded from herd totals
        herdStatus:
          type: string
          nullable: true
          enum: [dead, first-freshener, leased, on-farm, retired, sold]
          description: Current standing of the goat in the herd
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - breed
        - status
        - milkPerDay
        - age
        - createdAt
        - updatedAt

    CreateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, exposed, serviced, pregnant, kid, retired]
        age:
          type: integer
          description: Legacy field, calculated from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
        herdStatus:
          type: string
          nullable: true
          enum: [dead, first-freshener, leased, on-farm, retired, sold]
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4
      required:
        - name
        - breed

    UpdateGoatBody:
      type: object
      properties:
        name:
          type: string
        registeredName:
          type: string
        adgaId:
          type: string
        damName:
          type: string
        sireName:
          type: string
        maternalGranddamName:
          type: string
        maternalGrandsireName:
          type: string
        paternalGranddamName:
          type: string
        paternalGrandsireName:
          type: string
        damRegNo:
          type: string
        sireRegNo:
          type: string
        maternalGranddamRegNo:
          type: string
        maternalGrandsireRegNo:
          type: string
        paternalGranddamRegNo:
          type: string
        paternalGrandsireRegNo:
          type: string
        dateOfBirth:
          type: string
          format: date-time
        sex:
          type: string
          enum: [doe, buck, wether]
        breed:
          type: string
          enum: [alpine, nubian, saanen, lamancha, toggenburg, boer, nigerian-dwarf, oberhasli, mixed]
        status:
          type: string
          enum: [healthy, watch, treatment, dry]
        milkPerDay:
          type: number
          minimum: 0
          maximum: 10
        lactationStatus:
          type: string
          nullable: true
          enum: [milking, dry, exposed, serviced, pregnant, kid, retired]
        age:
          type: integer
          description: Calculated age in years from dateOfBirth
        description:
          type: string
        imageUrl:
          type: string
        leasedBuck:
          type: boolean
        herdStatus:
          type: string
          nullable: true
          enum: [dead, first-freshener, leased, on-farm, retired, sold]
        rightEarTattoo:
          type: string
          maxLength: 4
        leftEarTattoo:
          type: string
          maxLength: 4

    Breeding:
      type: object
      properties:
        id:
          type: integer
        doeId:
          type: integer
        sireName:
          type: string
        breedingMethod:
          type: string
          enum: [natural, ai]
          description: Breeding method — natural service (buck placed with doe) or artificial insemination
        semenSource:
          type: string
          nullable: true
          description: Optional free-text semen source/supplier note (AI breedings)
        semenStrawId:
          type: integer
          nullable: true
          description: The semen straw inventory entry this AI breeding was drawn from, if any
        breedingDate:
          type: string
          format: date-time
        expectedKiddingDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [bred, confirmed-pregnant, kidded, open]
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - doeId
        - sireName
        - breedingMethod
        - breedingDate
        - status
        - createdAt
        - updatedAt

    BreedingWithDoe:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"
            hasActiveExposure:
              type: boolean
              description: True when an exposed event exists but no removed event has been recorded
            exposedDays:
              type: integer
              nullable: true
              description: Days of exposure — when actively exposed, days since most recent exposed event; when removed, days between firstExposedDate and lastRemovedDate; null when no exposure events exist
            coverCount:
              type: integer
              description: Total number of witnessed cover events logged for this breeding
            hasExposureEvents:
              type: boolean
              description: True when at least one exposed event has ever been logged for this breeding
            firstExposedDate:
              type: string
              format: date-time
              nullable: true
              description: Date of the earliest exposed event for this breeding
            lastRemovedDate:
              type: string
              format: date-time
              nullable: true
              description: Date of the most recent removed event for this breeding

    BreedingDetail:
      allOf:
        - $ref: "#/components/schemas/Breeding"
        - type: object
          properties:
            doe:
              $ref: "#/components/schemas/Goat"
            kids:
              type: array
              items:
                $ref: "#/components/schemas/Kid"
            events:
              type: array
              items:
                $ref: "#/components/schemas/BreedingEvent"

