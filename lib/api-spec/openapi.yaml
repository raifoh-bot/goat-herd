          type: string
          minLength: 3
          maxLength: 32
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
      required:
        - farmName
        - slug
        - username
        - password

    CreateFarmBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 3
          maxLength: 32
        adminUsername:
          type: string
          minLength: 1
        adminPassword:
          type: string
          minLength: 8
      required:
        - name
        - slug
        - adminUsername
        - adminPassword

    UpdateFarmBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, suspended]

    FarmSettings:
      type: object
      properties:
        id:
          type: integer
        usesAi:
          type: boolean
          description: Whether this farm uses artificial insemination. When false, AI-related UI is hidden.
        farmName:
          type: string
          description: The farm/herd name shown in the app header and branding.
        adgaNumber:
          type: string
          nullable: true
          description: The farm's ADGA (American Dairy Goat Association) membership number.
        logoUrl:
          type: string
          nullable: true
          description: URL of the farm logo image shown in the sidebar and on printed reports.
        weightUnit:
          type: string
          enum: [kg, lb]
          description: Unit used for birth weights and milk production across the app.
        gestationDays:
          type: integer
          description: Default gestation length in days used to auto-calculate expected kidding dates.
        enabledBreeds:
          type: array
          description: The catalog breed slugs that exist on this farm. Only these appear in breed pickers.
          items:
            type: string
            enum: [alpine, angora, boer, guernsey, kiko, lamancha, mixed, myotonic, nigerian-dwarf, nubian, oberhasli, pygmy, recorded-grade, saanen, sable, savanna, spanish, texmaster, toggenburg]
        dashboardLayout:
          type: array
          description: Ordered list of dashboard widgets with their visibility. Normalized server-side so unknown ids are stripped and missing widgets are appended in default order.
          items:
            $ref: "#/components/schemas/DashboardWidget"
        famachaThreshold:
          type: integer
          minimum: 1
          maximum: 5
          description: FAMACHA score at or above which the app prompts to log a deworming.
        healthScheduleIntervals:
          $ref: "#/components/schemas/HealthScheduleIntervals"
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - usesAi
        - farmName
        - weightUnit
        - gestationDays
        - enabledBreeds
        - dashboardLayout
        - famachaThreshold
        - healthScheduleIntervals
        - updatedAt

    HealthScheduleIntervals:
      type: object
      description: >-
        Per-event-type routine interval, in days, that a farm repeats this work
        on. A type left out has no schedule and is never flagged as due.
      properties:
        hoof_trim:
          type: integer
          minimum: 1
          maximum: 3650
        cdt_shot:
          type: integer
          minimum: 1
          maximum: 3650
        copper_bolus:
          type: integer
          minimum: 1
          maximum: 3650
        deworming:
          type: integer
          minimum: 1
          maximum: 3650

    DashboardWidget:
      type: object
      description: >-
        A single dashboard widget's visibility and grid placement. The x/y/w/h
        fields describe the widget's position and size on a 12-column snap grid.
        They are optional so layouts saved before drag-and-resize shipped
        (which only carried id + visible) are forward-migrated with default
        coordinates on the next save.
      properties:
        id:
          type: string
          description: The widget identifier (e.g. total-goats, health-status).
        visible:
          type: boolean
          description: Whether the widget is shown on the dashboard.
        x:
          type: integer
          minimum: 0
          description: Column index (0-11) of the widget's top-left corner on the 12-column grid.
        y:
          type: integer
          minimum: 0
          description: Row index of the widget's top-left corner on the grid.
        w:
          type: integer
          minimum: 1
          description: Width of the widget in grid columns.
        h:
          type: integer
          minimum: 1
          description: Height of the widget in grid rows.
      required:
        - id
        - visible

    UpdateFarmSettingsBody:
      type: object
      description: Partial update of the farm settings. Only the provided fields are changed.
      properties:
        usesAi:
          type: boolean
        farmName:
          type: string
          minLength: 1
          maxLength: 100
        adgaNumber:
          type: string
          nullable: true
          maxLength: 50
        logoUrl:
          type: string
          nullable: true
        weightUnit:
          type: string
          enum: [kg, lb]
        gestationDays:
          type: integer
          minimum: 100
          maximum: 250
        enabledBreeds:
          type: array
          description: The catalog breed slugs that exist on this farm.
          items:
            type: string
            enum: [alpine, angora, boer, guernsey, kiko, lamancha, mixed, myotonic, nigerian-dwarf, nubian, oberhasli, pygmy, recorded-grade, saanen, sable, savanna, spanish, texmaster, toggenburg]
        dashboardLayout:
          type: array
          description: Ordered list of dashboard widgets with their visibility.
          items:
            $ref: "#/components/schemas/DashboardWidget"
        famachaThreshold:
          type: integer
          minimum: 1
          maximum: 5
          description: FAMACHA score at or above which the app prompts to log a deworming.
        healthScheduleIntervals:
          $ref: "#/components/schemas/HealthScheduleIntervals"

    DueHealthItem:
      type: object
      description: One event type that is coming due (or overdue) for a goat.
      properties:
        eventType:
          type: string
          enum: [hoof_trim, cdt_shot, copper_bolus, deworming]
        status:
          type: string
          enum: [overdue, due-soon, never]
          description: >-
            "never" — the goat has no record of this work yet; "overdue" — the
            interval has elapsed since the last time; "due-soon" — the due date
            falls within the lookahead window.
        intervalDays:
          type: integer
          description: The farm's configured interval in days for this event type.
        lastEventDate:
          type: string
          format: date-time
          nullable: true
          description: When this work was last done, or null if never.
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: When this work is next due, or null when it has never been done.
        daysOverdue:
          type: integer
          description: Whole days past the due date; 0 for "never" and "due-soon".
      required:
        - eventType
        - status
        - intervalDays
        - lastEventDate
        - dueDate
        - daysOverdue

    GoatDueHealth:
      type: object
      properties:
        goat:
          $ref: "#/components/schemas/Goat"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DueHealthItem"
      required:
        - goat
        - items

    HealthDueResponse:
      type: object
      properties:
        intervals:
          $ref: "#/components/schemas/HealthScheduleIntervals"
        goats:
          type: array
          items:
            $ref: "#/components/schemas/GoatDueHealth"
      required:
        - intervals
        - goats

    UpdateDashboardLayoutBody:
      type: object
      description: >-
        Sets the current user's personal dashboard layout. A null value clears
        the personal override so the farm-wide default applies.
      properties:
        dashboardLayout:
          type: array
          nullable: true
          description: The personal widget arrangement, or null to use the farm default.
          items:
            $ref: "#/components/schemas/DashboardWidget"
      required:
        - dashboardLayout
